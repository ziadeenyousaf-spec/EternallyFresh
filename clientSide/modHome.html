<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Moderator Dashboard | Eternally Fresh</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <link rel="stylesheet" href="/navBar.css">
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                padding: 2rem;
                color: #30204f;
                background:
                    radial-gradient(ellipse at 12% 8%, rgb(255 255 255 / 90%), transparent 22rem),
                    radial-gradient(ellipse at 85% 25%, rgb(255 128 215 / 28%), transparent 25rem),
                    linear-gradient(135deg, #d7f9ff 0%, #f8e3ff 48%, #fff1c8 100%);
                background-attachment: fixed;
                font-family: "Trebuchet MS", Arial, sans-serif;
            }
            main {
                max-width: 1150px;
                margin: 0 auto;
            }
            h1 {
                display: table;
                margin: 1.75rem 0 1rem;
                padding: 0.45rem 1.1rem;
                border: 2px solid #fff;
                border-radius: 999px;
                background: linear-gradient(110deg, #ff9bdc, #d7a9ff 55%, #8ceeff);
                box-shadow: 4px 5px 0 #9b6bc9;
                color: #39235f;
                font-size: clamp(1.35rem, 4vw, 2rem);
            }
            .dashboard-section[hidden] {
                display: none;
            }
            .status-message {
                min-height: 1.5rem;
                color: #287486;
                font-weight: 700;
            }
            .status-message.error {
                color: #9a2450;
            }
            #recipeList {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr));
                gap: 1.25rem;
            }
            .recipe-card,
            .food-table-wrap {
                min-width: 0;
                padding: 1rem;
                border: 2px solid #fff;
                border-radius: 22px;
                background: linear-gradient(145deg, rgb(255 255 255 / 94%), rgb(235 249 255 / 90%));
                box-shadow: 5px 6px 0 #b786e2;
            }
            .recipe-card-image {
                display: block;
                width: 100%;
                height: 180px;
                margin-bottom: 0.8rem;
                border: 2px solid #fff;
                border-radius: 16px;
                background: linear-gradient(135deg, #d9faff, #ffe1f5);
                object-fit: contain;
            }
            .recipe-card h2 {
                margin: 0 0 0.5rem;
                color: #642c91;
                overflow-wrap: anywhere;
            }
            .recipe-card p {
                margin: 0.5rem 0;
                overflow-wrap: anywhere;
            }
            .status-badge {
                display: inline-block;
                margin-bottom: 0.5rem;
                padding: 0.25rem 0.65rem;
                border-radius: 999px;
                background: #f3e5ff;
                color: #642c91;
                font-size: 0.85rem;
                font-weight: 700;
            }
            button,
            input,
            select,
            textarea {
                font: inherit;
            }
            button {
                min-height: 40px;
                padding: 0.55rem 0.85rem;
                border: 2px solid #fff;
                border-radius: 999px;
                background: linear-gradient(100deg, #ff9bdc, #d7a9ff 55%, #8ceeff);
                box-shadow: 3px 4px 0 #9b6bc9;
                color: #39235f;
                cursor: pointer;
                font-weight: 700;
            }
            button:disabled {
                cursor: wait;
                opacity: 0.65;
            }
            .food-table-wrap {
                overflow-x: auto;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                text-align: left;
            }
            th,
            td {
                padding: 0.75rem;
                border-bottom: 1px solid #d4b6ef;
                vertical-align: middle;
            }
            th {
                color: #542778;
            }
            .food-actions {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
            }
            .delete-food {
                background: linear-gradient(100deg, #ffd7e7, #ffb0b0);
            }
            dialog {
                width: min(720px, calc(100% - 2rem));
                max-height: calc(100% - 2rem);
                padding: clamp(1.25rem, 4vw, 2rem);
                overflow-y: auto;
                border: 2px solid #fff;
                border-radius: 28px;
                background: linear-gradient(145deg, #fff, #eaf9ff 55%, #f8e3ff);
                box-shadow: 7px 8px 0 #b786e2;
                color: #30204f;
            }
            dialog::backdrop {
                background: rgb(62 35 89 / 48%);
                backdrop-filter: blur(3px);
            }
            dialog label {
                display: block;
                margin: 0.8rem 0 0.35rem;
                color: #432967;
                font-weight: 700;
            }
            dialog input,
            dialog select,
            dialog textarea {
                width: 100%;
                min-height: 42px;
                padding: 0.6rem 0.75rem;
                border: 2px solid #d4b6ef;
                border-radius: 12px;
                background: #fff;
                color: #30204f;
            }
            dialog textarea {
                min-height: 130px;
            }
            .ingredient-row {
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(90px, 0.5fr) auto;
                align-items: end;
                gap: 0.6rem;
                margin-bottom: 0.7rem;
            }
            .dialog-actions {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 0.75rem;
                margin-top: 1.25rem;
            }
            .dialog-actions .secondary {
                background: linear-gradient(100deg, #e6f7ff, #d8d0ff);
            }
            @media (max-width: 650px) {
                body {
                    padding: 1rem;
                }
                th,
                td {
                    padding: 0.55rem;
                }
            }
        </style>
        <script src="/modHome.js" defer></script>
        <script src="/navBar.js" defer></script>
    </head>
    <body>
        <button class="nav-toggle" type="button" aria-label="Open navigation" aria-controls="site-navigation" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
        <div class="nav-backdrop" data-nav-close hidden></div>
        <aside class="site-navigation" id="site-navigation" aria-label="Moderator navigation" aria-hidden="true">
            <a class="nav-logo" href="/Moderator/Home" aria-label="Eternally Fresh moderator home">
                <img class="nav-logo-image" src="/logo.png" alt="Eternally Fresh">
                <span>Eternally Fresh</span>
            </a>
            <nav>
                <a href="#home" data-dashboard-section="home">Home</a>
                <a href="#recipes" data-dashboard-section="recipes">All Recipes</a>
                <a href="#foods" data-dashboard-section="foods">All Items</a>
                <a href="/Moderator/LogOut">Logout</a>
            </nav>
        </aside>
        <main>
            <section class="dashboard-section" id="homeSection" aria-labelledby="homeTitle">
                <h1 id="homeTitle">Recipes Needing Review</h1>
                <p class="status-message" id="reviewStatus" role="status" aria-live="polite">Loading recipes for review...</p>
                <div id="reviewRecipeList"></div>
            </section>
            <section class="dashboard-section" id="recipesSection" aria-labelledby="recipesTitle" hidden>
                <h1 id="recipesTitle">All Recipes</h1>
                <p class="status-message" id="recipeStatus" role="status" aria-live="polite">Loading recipes...</p>
                <div id="recipeList"></div>
            </section>
            <section class="dashboard-section" id="foodsSection" aria-labelledby="foodsTitle" hidden>
                <h1 id="foodsTitle">All Food Items</h1>
                <p class="status-message" id="foodStatus" role="status" aria-live="polite">Loading food items...</p>
                <div class="food-table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Name</th>
                                <th scope="col">Maximum size</th>
                                <th scope="col">Measurement</th>
                                <th scope="col">Barcode</th>
                                <th scope="col">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="foodRows"></tbody>
                    </table>
                </div>
            </section>
        </main>
        <dialog id="editRecipeDialog" aria-labelledby="editRecipeTitle">
            <form id="editRecipeForm">
                <h2 id="editRecipeTitle">Edit recipe</h2>
                <label for="editRecipeName">Recipe name</label>
                <input id="editRecipeName" maxlength="200" required>
                <label for="editRecipeCookingTime">Cooking time (minutes)</label>
                <input id="editRecipeCookingTime" type="number" min="1" step="1" required>
                <label for="editRecipeServingSize">Servings</label>
                <input id="editRecipeServingSize" type="number" min="1" step="1" required>
                <label>Ingredients</label>
                <div id="editRecipeIngredients"></div>
                <button id="addRecipeIngredient" type="button" class="secondary">Add ingredient</button>
                <label for="editRecipeInstructions">Instructions</label>
                <textarea id="editRecipeInstructions" required></textarea>
                <label for="editRecipeStatus">Publication status</label>
                <select id="editRecipeStatus" required>
                    <option value="private">private</option>
                    <option value="needs review">needs review</option>
                    <option value="public">public</option>
                    <option value="banned">banned</option>
                </select>
                <p class="status-message" id="editRecipeStatusMessage" role="status" aria-live="polite"></p>
                <div class="dialog-actions">
                    <button type="button" class="secondary" data-close-dialog="editRecipeDialog">Cancel</button>
                    <button type="submit">Save recipe</button>
                </div>
            </form>
        </dialog>
        <dialog id="editFoodDialog" aria-labelledby="editFoodTitle">
            <form id="editFoodForm">
                <h2 id="editFoodTitle">Edit food item</h2>
                <label for="editFoodName">Name</label>
                <input id="editFoodName" maxlength="200" required>
                <label for="editFoodMaxSize">Maximum size</label>
                <input id="editFoodMaxSize" type="number" min="0.01" step="any" required>
                <label for="editFoodUnits">Measurement type</label>
                <input id="editFoodUnits" maxlength="40" required>
                <label for="editFoodBarcode">Barcode number (-1 for none)</label>
                <input id="editFoodBarcode" type="number" min="-1" step="1" required>
                <p class="status-message" id="editFoodStatus" role="status" aria-live="polite"></p>
                <div class="dialog-actions">
                    <button type="button" class="secondary" data-close-dialog="editFoodDialog">Cancel</button>
                    <button type="submit">Save item</button>
                </div>
            </form>
        </dialog>
    </body>
</html>
