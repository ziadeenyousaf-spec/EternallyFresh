<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Recipes | Eternally Fresh</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <link rel="stylesheet" href="/navBar.css">
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                padding: 2rem;
                color: #30204f;
                background:
                    radial-gradient(ellipse at 12% 8%, rgb(255 255 255 / 90%), transparent 22rem),
                    radial-gradient(ellipse at 85% 25%, rgb(255 128 215 / 28%), transparent 25rem),
                    linear-gradient(135deg, #d7f9ff 0%, #f8e3ff 48%, #fff1c8 100%);
                background-attachment: fixed;
                font-family: "Trebuchet MS", Arial, sans-serif;
            }
            main {
                max-width: 1100px;
                margin: 0 auto;
            }
            h1 {
                display: table;
                margin: 1.75rem 0 1rem;
                padding: 0.45rem 1.1rem;
                border: 2px solid #fff;
                border-radius: 999px;
                background: linear-gradient(110deg, #ff9bdc, #d7a9ff 55%, #8ceeff);
                box-shadow: 4px 5px 0 #9b6bc9, 0 0 18px rgb(255 255 255 / 80%);
                color: #39235f;
                font-size: clamp(1.35rem, 4vw, 2rem);
                text-shadow: 1px 1px 0 #fff;
            }
            #recipeStatus {
                min-height: 1.5rem;
                color: #287486;
                font-weight: 700;
            }
            #recipeStatus.error {
                color: #9a2450;
            }
            #recipeList {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(min(230px, 100%), 1fr));
                gap: 1.25rem;
            }
            .recipe-card {
                position: relative;
                display: flex;
                min-width: 0;
                flex-direction: column;
                padding: 1rem;
                border: 2px solid #fff;
                border-radius: 22px;
                background: linear-gradient(145deg, rgb(255 255 255 / 92%), rgb(235 249 255 / 88%));
                box-shadow: 5px 6px 0 #b786e2, 0 0 18px rgb(255 255 255 / 65%);
                color: inherit;
                cursor: pointer;
                font: inherit;
                text-align: left;
                transition: transform 150ms ease, filter 150ms ease;
            }
            .recipe-card:hover,
            .recipe-card:focus-visible {
                filter: brightness(1.04);
                outline: 3px solid #fff;
                outline-offset: 3px;
                transform: translateY(-3px);
            }
            .recipe-card img {
                display: block;
                width: 100%;
                height: 190px;
                margin-bottom: 0.75rem;
                border: 2px solid #fff;
                border-radius: 16px;
                background: linear-gradient(135deg, #d9faff, #ffe1f5);
                object-fit: contain;
            }
            .recipe-card h2 {
                margin: 0;
                color: #642c91;
                font-size: 1.15rem;
                overflow-wrap: anywhere;
            }
            .recipe-card p {
                margin: 0.55rem 0 0;
                color: #287486;
            }
            .recipe-card-view {
                display: block;
                width: 100%;
                padding: 0;
                border: 0;
                background: transparent;
                color: inherit;
                cursor: pointer;
                font: inherit;
                text-align: left;
            }
            .recipe-card-view:focus-visible {
                outline: 3px solid #8a5bc0;
                outline-offset: 3px;
            }
            .recipe-card-actions {
                position: absolute;
                top: 0.6rem;
                right: 0.6rem;
                display: flex;
                gap: 0.4rem;
            }
            .recipe-card-actions button,
            .recipe-owner-actions button,
            #editRecipeDialog button {
                min-height: 40px;
                padding: 0.55rem 0.8rem;
                border: 2px solid #fff;
                border-radius: 999px;
                background: linear-gradient(100deg, #ff9bdc, #d7a9ff 55%, #8ceeff);
                box-shadow: 3px 4px 0 #9b6bc9;
                color: #39235f;
                cursor: pointer;
                font: inherit;
                font-weight: 700;
            }
            .recipe-card-actions button {
                min-height: 40px;
                font-size: 1.2rem;
            }
            .recipe-card-actions .recipe-card-edit {
                width: 40px;
                padding: 0;
            }
            .recipe-card-actions .recipe-card-publish {
                padding: 0.45rem 0.7rem;
                background: linear-gradient(100deg, #e6f7ff, #d8d0ff);
                font-size: 0.82rem;
            }
            .recipe-card-actions .recipe-card-publish:disabled {
                cursor: default;
                opacity: 0.75;
            }
            .recipe-status-badge {
                display: inline-block;
                width: fit-content;
                margin-top: 0.6rem;
                padding: 0.25rem 0.6rem;
                border-radius: 999px;
                background: #f3e5ff;
                color: #642c91;
                font-size: 0.82rem;
                font-weight: 700;
            }
            #recipeDetails {
                width: min(760px, calc(100% - 2rem));
                max-height: calc(100% - 2rem);
                padding: clamp(1.25rem, 4vw, 2rem);
                overflow-y: auto;
                border: 2px solid #fff;
                border-radius: 28px;
                background: linear-gradient(145deg, #fff, #eaf9ff 55%, #f8e3ff);
                box-shadow: 7px 8px 0 #b786e2, 0 0 24px rgb(255 255 255 / 80%);
                color: #30204f;
                font: inherit;
            }
            #recipeDetails::backdrop {
                background: rgb(62 35 89 / 48%);
                backdrop-filter: blur(3px);
            }
            #recipeDetails h2 {
                margin: 0 3rem 0.75rem 0;
                color: #542778;
                font-size: clamp(1.5rem, 5vw, 2rem);
                overflow-wrap: anywhere;
            }
            #recipeDetails h3 {
                margin: 1.5rem 0 0.5rem;
                color: #642c91;
            }
            .recipe-detail-image {
                display: block;
                width: 100%;
                max-height: 360px;
                margin: 1rem 0;
                border: 2px solid #fff;
                border-radius: 18px;
                background: linear-gradient(135deg, #d9faff, #ffe1f5);
                object-fit: contain;
            }
            #recipeIngredients,
            #recipeInstructions {
                padding-left: 1.5rem;
                line-height: 1.65;
            }
            #recipeInstructions {
                padding-left: 0;
                list-style: none;
            }
            #recipeInstructions li + li,
            #recipeIngredients li + li {
                margin-top: 0.5rem;
            }
            #recipeInstructions li {
                white-space: pre-line;
            }
            .recipe-owner-actions {
                display: flex;
                flex-wrap: wrap;
                gap: 0.75rem;
                margin-top: 1.5rem;
            }
            .recipe-owner-actions[hidden] {
                display: none;
            }
            .recipe-owner-actions button[type="button"] {
                background: linear-gradient(100deg, #e6f7ff, #d8d0ff);
            }
            #recipeActionStatus,
            #editRecipeStatus {
                min-height: 1.4rem;
                color: #287486;
                font-weight: 700;
            }
            #recipeActionStatus.error,
            #editRecipeStatus.error {
                color: #9a2450;
            }
            #editRecipeDialog {
                width: min(700px, calc(100% - 2rem));
                max-height: calc(100% - 2rem);
                padding: clamp(1.25rem, 4vw, 2rem);
                overflow-y: auto;
                border: 2px solid #fff;
                border-radius: 28px;
                background: linear-gradient(145deg, #fff, #eaf9ff 55%, #f8e3ff);
                box-shadow: 7px 8px 0 #b786e2;
                color: #30204f;
                font: inherit;
            }
            #editRecipeDialog::backdrop {
                background: rgb(62 35 89 / 48%);
                backdrop-filter: blur(3px);
            }
            #editRecipeDialog input,
            #editRecipeDialog select,
            #editRecipeDialog textarea {
                width: 100%;
                min-height: 42px;
                padding: 0.6rem 0.75rem;
                border: 2px solid #d4b6ef;
                border-radius: 12px;
                background: #fff;
                color: #30204f;
                font: inherit;
            }
            #editRecipeDialog textarea {
                min-height: 130px;
            }
            #editRecipeDialog label {
                display: block;
                margin: 0.8rem 0 0.35rem;
                color: #432967;
                font-weight: 700;
            }
            .recipe-edit-note {
                color: #287486;
                font-size: 0.92rem;
            }
            .recipe-edit-ingredient {
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(90px, 0.5fr) auto;
                align-items: end;
                gap: 0.6rem;
                margin-bottom: 0.7rem;
            }
            .recipe-edit-ingredient button {
                width: 40px;
                padding: 0;
            }
            #editRecipeDialog .recipe-edit-actions {
                display: flex;
                justify-content: center;
                gap: 0.75rem;
                margin-top: 1.25rem;
            }
            #editRecipeDialog .recipe-edit-actions button[type="button"] {
                background: linear-gradient(100deg, #e6f7ff, #d8d0ff);
            }
            #recipeClose {
                position: sticky;
                top: 0;
                float: right;
                width: 42px;
                height: 42px;
                margin: -0.5rem -0.5rem 0 0.75rem;
                border: 2px solid #fff;
                border-radius: 14px;
                background: linear-gradient(145deg, #ff8dd8, #9f82ff 58%, #58dfff);
                box-shadow: 3px 4px 0 #7952b3;
                color: #fff;
                cursor: pointer;
                font-size: 1.4rem;
                font-weight: 700;
            }
            @media (max-width: 650px) {
                body {
                    padding: 1rem;
                }
                .recipe-card img {
                    height: 170px;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .recipe-card {
                    transition: none;
                }
            }
        </style>
        <script src="/loadAllRecipes.js" defer></script>
        <script src="/navBar.js" defer></script>
    </head>
    <body>
        <button class="nav-toggle" type="button" aria-label="Open navigation" aria-controls="site-navigation" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="nav-backdrop" data-nav-close hidden></div>
        <aside class="site-navigation" id="site-navigation" aria-label="Main navigation" aria-hidden="true">
            <a class="nav-logo" href="/Customer/Home" aria-label="Eternally Fresh home">
                <img class="nav-logo-image" src="/logo.png" alt="Eternally Fresh">
                <span>Eternally Fresh</span>
            </a>
            <nav>
                <a href="/Customer/Home">Home</a>
                <a href="/Customer/EditItems">Edit Items</a>
                <a href="/Customer/AddItem">Add New Items</a>
                <a href="/Customer/SearchRecipes">Search Recipes</a>
                <a href="/Customer/CreateRecipe">Create Recipes</a>
                <a href="/Customer/LogOut">Logout</a>
            </nav>
        </aside>
        <main>
            <h1>Explore Recipes</h1>
            <p id="recipeStatus" role="status" aria-live="polite">Loading recipes...</p>
            <div id="recipeList"></div>
        </main>
        <dialog id="recipeDetails" aria-labelledby="recipeDetailTitle">
            <button id="recipeClose" type="button" aria-label="Close recipe details">&times;</button>
            <h2 id="recipeDetailTitle"></h2>
            <p id="recipeCookingTime"></p>
            <p id="recipeServingSize"></p>
            <img class="recipe-detail-image" id="recipeDetailImage" alt="">
            <section aria-labelledby="ingredientsTitle">
                <h3 id="ingredientsTitle">Ingredients</h3>
                <ul id="recipeIngredients"></ul>
            </section>
            <section aria-labelledby="instructionsTitle">
                <h3 id="instructionsTitle">Instructions</h3>
                <ul id="recipeInstructions"></ul>
            </section>
            <div class="recipe-owner-actions" id="recipeOwnerActions" hidden>
                <button id="editOwnRecipe" type="button">Edit recipe</button>
                <button id="publishOwnRecipe" type="button">Submit for review</button>
                <span id="recipePublicStatus"></span>
            </div>
            <p id="recipeActionStatus" role="status" aria-live="polite"></p>
        </dialog>
        <dialog id="editRecipeDialog" aria-labelledby="editRecipeTitle">
            <form id="editRecipeForm">
                <h2 id="editRecipeTitle">Edit your recipe</h2>
                <p class="recipe-edit-note">Saving changes returns the recipe to private. Submit it for review when it is ready to publish.</p>
                <label for="editRecipeName">Recipe name</label>
                <input id="editRecipeName" type="text" maxlength="200" required>
                <label for="editRecipeCookingTime">Cooking time (minutes)</label>
                <input id="editRecipeCookingTime" type="number" min="1" step="1" required>
                <label for="editRecipeServingSize">Servings</label>
                <input id="editRecipeServingSize" type="number" min="1" step="1" required>
                <label>Ingredients</label>
                <div id="editRecipeIngredients"></div>
                <button id="addEditRecipeIngredient" type="button">Add ingredient</button>
                <label for="editRecipeInstructions">Instructions</label>
                <textarea id="editRecipeInstructions" required></textarea>
                <p id="editRecipeStatus" role="status" aria-live="polite"></p>
                <div class="recipe-edit-actions">
                    <button id="cancelEditRecipe" type="button">Cancel</button>
                    <button type="submit">Save changes</button>
                </div>
            </form>
        </dialog>
    </body>
</html>
